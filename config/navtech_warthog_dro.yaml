 /**:
  ros__parameters:
  ############ system configuration ############
    log_to_file: true
    log_debug: true
    log_enabled:
      # - navigation
      # - navigation.sensor_input
      # - radar.online_converter
      - radar.odometry_dro
      - radar.scan_to_pointmap
      - radar.localization_drl
      #- radar.localization_map_recall
      #- tactic
      # - tactic.pipeline
      - tactic.module
      #- radar.pipeline
      # - mpc.debug
      # - cbit.control
      #- mission.state_machine
      #- mission.server
    robot_frame: w200_0066_base_link #w200_0066_base_link
    env_info_topic: env_info
    radar_frame: w200_0066_navtech_base # w200_0066_navtech_base #navtech_base
    radar_topic: /radar_data/b_scan_msg
    gyro_frame: w200_0066_os_imu #w200_0066_os_imu #navtech_base
    gyro_topic: /ouster/imu
    gyro_enabled: false
    gyro_bias: 
      z: 0.0007706056060006737

    queue_size: 1
    graph_projection:
      origin_lat: 43.7822 # UTIAS: 43.78220
      origin_lng: -79.4661 # UTIAS: -79.4661
      origin_theta: 1.3
      scale: 1.0
    # Added Tactical Params
    tactic:
      enable_parallelization: true
      preprocessing_skippable: false
      odometry_mapping_skippable: false
      localization_skippable: true
      task_queue_num_threads: 1
      task_queue_size: -1

      route_completion_translation_threshold: 0.1

      chain:
        min_cusp_distance: 1.5
        angle_weight: 7.0
        search_depth: 5
        search_back_depth: 10
        distance_warning: 5.0
      save_odometry_result: true
      save_localization_result: true
      visualize: true
      rviz_loc_path_offset:
        - 0.0
        - 0.0
        - 0.0                                                                                                                                                                  
    ############ pipeline configuration ############
    pipeline:
      type: direct_radar
      preprocessing: 
        - conversion
      odometry:
        - dro
        - vertex_test
        - memory
      localization: 
        - recall
        - drl
        - memory
      submap_translation_threshold: 1.5
      submap_rotation_threshold: 30.0
    preprocessing:
      conversion:
        type: radar.online_converter
        radar_resolution: 0.040308
        encoder_bin_size: 16000 # encoder bin size
        cart_resolution: 0.0
    odometry:
      dro:
        type: radar.odometry_dro

        direct:
          local_map_res: 0.1
          local_map_update_alpha: 0.25
          max_local_map_range: 40.0
          max_range: 69.0
          min_range: 2.0
          # Fixed blurring of DRO's local map, for downstream (mapping, DRL)
          # consumption. scan_to_pointmap may blur further, for mapping only.
          gauss_blur_sigma: 3.0 # pixels, kernel size is (ceil(6 * sigma) | 1)
        estimation:
          estimate_vy_bias: false
          estimate_gyro_bias: false
          use_gyro: false
          vy_bias_prior: 0.11
          min_time_bias_init: 1.0
          gyro_bias_alpha: 0.01
          max_acceleration: 10.0
          ang_vel_bias: 0.0 # Constant ang vel bias for gyro-free operation, needs to be tuned
        gp:
          lengthscale_az: 1.0
          lengthscale_range: 1.0
          sz: 0.6
        radar:
          beta_corr_fact: 0.944
          del_f: 893.0E6
          ft: 76.04E9
          meas_freq: 1600.0
          range_offset: -0.32
          resolution: 0.040308
          doppler_enabled: false
          nb_azimuths: 400
        solver:
          nb_iter: 50
          cost_tol: 1.0E-4
          step_tol: 1.0E-4

        visualize: true

      vertex_test:
        type: radar.vertex_test

        max_translation: 0.3
        max_rotation: 10.0

      scan_to_pointmap:
        type: radar.scan_to_pointmap
        map_resolution: 0.5 # submap voxel size in meters

        # Additional blurring on top of DRO's fixed gauss_blur_sigma blur,
        # applied only when building the submap (not for drl/localization)
        adaptive_blur: false # raise sigma further until min_percent_nonzero of the scan is non-zero
        max_blur_sigma: 15.0 # max additional sigma for adaptive blur
        min_int_val_tol: 0.5 # min intensity value to consider a pixel non-zero
        min_percent_nonzero: 0.3 # percent of pixels above min_int_val_tol to stop blurring

      memory:
        type: "live_mem_manager"

        window_size: 5 # unload data older than this many keyframes

    localization:
      recall:
        type: radar.localization_map_recall

        map_version: "pointmap"

        visualize: true

      drl:
        type: "radar.localization_drl"

        max_iterations: 25
        convergence_tol: 1.0e-4
        alpha: 1.0          # Gauss-Newton step size
        max_dist: 0.0     # radius (m) around the initial guess to query map voxels (<=0 uses all)
        meas_std: 0.1       # intensity measurement noise std-dev (normalised [0,1] scale)
        range_factor: 0.0005   # adds range-dependent intensity uncertainty
        num_threads: 8

        use_pose_prior: false
        prior_cov_diag: [1e1, 1e1, 1e1]
      memory:
        type: "graph_mem_manager"
        vertex_life_span: 5
        window_size: 3

    path_planning:
      type: unicycle_mpc
      control_period: 100 # ms

      speed_scheduler:
        planar_curv_weight: 0.0
        profile_curv_weight: 0.0 
        eop_weight: 1.0
        min_vel: 0.5
      mpc:
        # Controller Params
        extrapolate_robot_pose: false
        mpc_verbosity: false
        forward_vel: 1.0
        max_lin_vel: 1.5
        max_ang_vel: 0.5
        max_ang_acc: 5.0
        ang_alpha: 0.811
        lin_alpha: 0.0
       
        vehicle_model: "unicycle"

        q_x: 10.0
        q_y: 10.0
        q_th: 5.0
        r1: 1.0
        r2: 1.0
        racc1: 0.1
        racc2: 0.5

        # Misc
        command_history_length: 100